<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Console Transcriber</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Console Transcriber</h1>
  </header>
  <main>
    <section class="panel">
      <div class="row">
          <label>Language</label>
          <input id="language" value="en" />
          <label>Model</label>
          <select id="model">
            <option>tiny</option>
            <option selected>base</option>
            <option>small</option>
            <option>medium</option>
          </select>
          <label>Diarization</label>
          <input type="checkbox" id="diarization" />
        </div>
        <div class="controls">
          <button id="start">Start</button>
          <button id="stop" class="secondary">Stop</button>
          <button id="clear" class="secondary">Clear</button>
          <button id="copy" class="secondary">Copy</button>
        </div>
        <pre id="output" class="output" spellcheck="false"></pre>
      </div>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
